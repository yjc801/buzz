[package]
name = "buzz-waker"
version.workspace = true
edition.workspace = true
# Overrides the workspace 1.88: the fenced floor store uses
# std::fs::File::lock (stabilised 1.89), which is cross-platform —
# flock on Unix, LockFileEx on Windows. rustix::fs::flock is POSIX-only
# and broke the Windows workspace check.
rust-version = "1.89.0"
license.workspace = true
repository.workspace = true
description = "Headless wake daemon for remote Buzz agents: signed launch bundles and durable anti-rollback state"

[dependencies]
buzz-core  = { workspace = true }
nostr       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
hex         = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Tests only: the attempt state machine is generic over its effects, so the
# crate itself pulls in no runtime — but driving an async test needs one.
tokio       = { workspace = true }
