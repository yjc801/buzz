name: Fork Desktop Release

# Builds a signed, notarized Apple Silicon DMG of Waggle -- this fork's desktop
# app -- and publishes it as a GitHub Release on the fork itself.
#
# This file deliberately does not exist upstream. Keeping the fork's release
# path in its own file (rather than patching release.yml) means `git merge
# upstream/main` never conflicts here.
#
# Differences from upstream release.yml, and why:
#
#   * Signed with this fork's own Developer ID, not Block's. Upstream signs via
#     block/apple-codesign-action, which authenticates by OIDC to Block
#     infrastructure a fork cannot reach. Hence the rename: the artifact is
#     Waggle under its own bundle identifier, so it neither claims Block's
#     product name nor collides with the official app's data directory.
#   * No updater artifacts. Upstream injects an updater endpoint + pubkey via
#     desktop/scripts/build-release-config.mjs. A fork enabling that would need
#     its own signing keypair, and pointing it at the upstream feed would
#     auto-update this build back into an official one, silently discarding the
#     fork's changes. Update by downloading a new DMG instead.
#   * No mesh-llm. That feature compiles llama.cpp from source and dominates
#     build time. Upstream's Intel and Windows jobs ship without it too, so
#     this is a supported configuration. Add `--features mesh-llm` to the build
#     step if the fork needs local inference.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if no new commits since the last fork release"
        type: boolean
        default: false
  schedule:
    # Mondays 14:00 UTC. Scheduled runs skip themselves when main has not moved.
    - cron: "0 14 * * 1"

concurrency:
  group: fork-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed macOS release
    # Forks only. Guards against this ever running upstream if the file is
    # merged there by accident.
    if: github.repository != 'block/buzz'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the release and upload the DMG
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if nothing new since the last fork release
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # `gh release list --json` cannot return targetCommitish (supported
          # fields: createdAt, isDraft, isImmutable, isLatest, isPrerelease,
          # name, publishedAt, tagName). Pick the newest fork tag from the
          # list, then read its target with `gh release view`, which does
          # expose targetCommitish. These releases are prereleases, so
          # `isLatest` never matches them — filter on the tag prefix instead.
          LAST_TAG=$(gh release list --limit 100 --order desc --exclude-drafts \
                       --json tagName \
                       --jq 'map(select(.tagName | startswith("fork-desktop-v")))
                             | .[0].tagName // empty')
          LAST=""
          if [[ -n "$LAST_TAG" ]]; then
            LAST=$(gh release view "$LAST_TAG" --json targetCommitish \
                     --jq '.targetCommitish // empty')
          fi
          if [[ "$FORCE" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Forced build requested."
          elif [[ -n "$LAST" && "$LAST" == "$GITHUB_SHA" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD ($GITHUB_SHA) already released; skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail in seconds rather than ~20 minutes, and fail LOUDLY. The dangerous
      # outcome is not a missing secret causing a crash — it is Tauri quietly
      # skipping the signing step and producing an unsigned bundle that looks
      # like a successful release, then dying with "Waggle is damaged" on the
      # user's machine. Checked after the freshness gate so a skipped run stays
      # a no-op instead of failing on credentials it never needed.
      - name: Require signing credentials
        if: steps.freshness.outputs.build == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            # Presence only — never echo a value.
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Cannot build a signed release. Missing repository secrets: ${missing[*]}"
            echo "Set them with: gh secret set <NAME> --repo $GITHUB_REPOSITORY"
            echo "APPLE_CERTIFICATE is a base64-encoded Developer ID .p12."
            echo "APPLE_PASSWORD is an app-specific password, not the Apple ID password."
            exit 1
          fi
          echo "All six signing credentials present."

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
        if: steps.freshness.outputs.build == 'true'

      - name: Get pnpm store directory
        if: steps.freshness.outputs.build == 'true'
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        if: steps.freshness.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        if: steps.freshness.outputs.build == 'true'
        run: just desktop-install-ci

      - name: Derive fork version
        if: steps.freshness.outputs.build == 'true'
        id: version
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "::error::Desktop version '$BASE' is not semver"
            exit 1
          fi
          # Pre-release suffix keeps fork builds sorting below the upstream
          # version they are based on, and makes the provenance obvious in the
          # About window.
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-fork.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $GITHUB_SHA"

      - name: Patch version
        if: steps.freshness.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Restore Cargo cache
        if: steps.freshness.outputs.build == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/target
            !desktop/src-tauri/target/**/release/bundle
          key: fork-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: fork-release-${{ runner.os }}-

      - name: Generate non-updating bundle config
        if: steps.freshness.outputs.build == 'true'
        run: |
          cat > desktop/src-tauri/tauri.fork.conf.json <<'JSON'
          {
            "bundle": {
              "macOS": {
                "minimumSystemVersion": "10.15"
              },
              "createUpdaterArtifacts": false
            }
          }
          JSON

      # The step that matters most. Tauri's bundler will happily package
      # zero-byte sidecar stubs, producing an app that launches fine and then
      # fails at runtime with "ACP harness command `buzz-acp` was not found"
      # the first time anyone starts a local agent. bundle-sidecars.sh hard-
      # fails on a missing binary, so this must run before the Tauri build.
      - name: Build sidecars
        if: steps.freshness.outputs.build == 'true'
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes \
            -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      # Signed and notarized with THIS fork's Developer ID, under the Waggle
      # name and its own bundle identifier. Signing as Buzz under
      # `xyz.block.buzz.app` would collide with the official app's data
      # directory and present Block's product under a third-party identity.
      #
      # Tauri drives codesign and notarytool itself from these variables, so
      # there is no separate signing step: with APPLE_CERTIFICATE set it signs,
      # and with the notarization credentials set it staples before the DMG is
      # written.
      - name: Build signed Tauri app
        if: steps.freshness.outputs.build == 'true'
        run: cd desktop && pnpm tauri build --verbose --config src-tauri/tauri.fork.conf.json
        env:
          # Developer ID Application cert, exported as .p12 and base64'd.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Full identity string, e.g. "Developer ID Application: Name (TEAMID)".
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. APPLE_PASSWORD is an app-specific password, not the
          # Apple ID password itself.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # audiopus_sys (via the desktop crate's `opus` dep) bundles Opus with
          # `cmake_minimum_required(VERSION 3.1)`, which CMake 4 on the current
          # macOS ARM runner image rejects. Every other native build workflow
          # here carries the same override.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Stage DMG
        if: steps.freshness.outputs.build == 'true'
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SRC=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f | head -1)
          if [[ -z "$SRC" ]]; then
            echo "::error::No DMG produced"
            exit 1
          fi
          NAME="Waggle_${VERSION}_aarch64.dmg"
          cp "$SRC" "$RUNNER_TEMP/$NAME"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Verifies the sidecars actually made it in, so a stub regression fails
      # the build instead of shipping.
      - name: Verify bundled sidecars
        if: steps.freshness.outputs.build == 'true'
        run: |
          set -euo pipefail
          APP=desktop/src-tauri/target/release/bundle/macos/Waggle.app/Contents/MacOS
          for bin in buzz-acp buzz-agent buzz buzz-dev-mcp; do
            if [[ ! -s "$APP/$bin" ]]; then
              echo "::error::sidecar $bin missing or empty in the bundle"
              exit 1
            fi
            echo "ok: $bin ($(stat -f%z "$APP/$bin") bytes)"
          done

      # The preflight proves the secrets EXIST. This proves they worked. A wrong
      # or expired certificate, or a Tauri version that skips signing instead of
      # erroring, both land here as a bundle carrying only the linker's ad-hoc
      # signature — which is exactly what Gatekeeper reports as "damaged". That
      # must fail the build, not reach a release page.
      - name: Verify the bundle is really signed
        if: steps.freshness.outputs.build == 'true'
        run: |
          set -euo pipefail
          APP=desktop/src-tauri/target/release/bundle/macos/Waggle.app

          # `Signature=adhoc` is the tell-tale of an unsigned build. The two
          # checks below would also reject it, but they report it as "code has
          # no resources but signature indicates they must be present" — which
          # sends you looking at the bundle rather than at the credentials.
          # This names the real problem first.
          if codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::Bundle is ad-hoc signed, not Developer ID signed. Check APPLE_SIGNING_IDENTITY."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          # Gatekeeper's own verdict, which is what the user's machine applies.
          spctl --assess --type execute --verbose=4 "$APP"

          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          echo "Signed and accepted by Gatekeeper."

      - name: Publish release
        if: steps.freshness.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Signed and notarized Apple Silicon build from \`$GITHUB_SHA\`.

          Drag Waggle to /Applications and open it — no quarantine command
          needed. Waggle installs alongside Buzz rather than replacing it, and
          adopts a copy of your existing Buzz agents, personas, and communities
          on first launch. Buzz keeps its own data untouched.

          No auto-updater: install a newer DMG from this page to update.
          EOF
          )
          gh release create "fork-desktop-v${VERSION}" \
            --title "Waggle ${VERSION}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --prerelease \
            "$DMG_PATH"
