name: buzz-pr-mirror

# Gives every PR on this fork its own Buzz channel (#buzz-pr-N):
#   opened      → create the channel, seed it with a summary card, add and
#                 mention Alex for review
#   synchronize → after a quiet window, post a compact update (new head,
#                 shortstat, files) that names the settled `Review head` and
#                 re-mentions Alex unless he already replied to that head —
#                 only a CI or human mention can wake a hibernated reviewer
#                 (crates/buzz-waker/src/decide.rs — no agent-authored event
#                 ever wakes anything), so a coder's "@Alex pushed the fix"
#                 alone leaves him asleep
#   closed      → post ✅ Merged / 🚫 Closed without merge, then archive
#   reopened    → unarchive, and reverse the close annotations everywhere
#   schedule    → archive the room of any PR whose close GitHub never
#                 announced (sweep_missed_closes — see below), and restore
#                 one it archived under a PR reopened out from under it
#
# Ported from yjc801/velvet's buzz-pr-mirror.yml. Keep the two in sync when
# fixing relay-behavior bugs — the hard-won invariants in the shell below
# (search failure ≠ absence, CI-authored seed markers, write-outcome-driven
# unarchive) were all paid for once already and apply identically here.
#
# A CLOSE GITHUB NEVER ANNOUNCES IS RECONCILED BY THE SWEEP. A `pull_request`
# run executes on the PR's merge commit, so for a PR GitHub cannot merge it
# schedules no run at all — not a skipped one, none: a PR with conflicts, and
# a PR GitHub closed itself because the branch it targeted was deleted. A
# stacked PR is both at once the moment its parent merges and the parent's
# branch goes: velvet#174, velvet#210 and buzz#128 each closed within seconds
# of their base branch's deletion, none got a `closed` run, and each left its
# room live with its seed card still asking for a review. No trigger closes
# the base-deleted half (`pull_request_target` would fire on a conflicting PR,
# but it resolves the workflow from the base branch — the thing that was
# deleted), so the schedule below runs sweep_missed_closes: every same-repo PR
# closed within SWEEP_DAYS and settled for SWEEP_SETTLE_SECS has its room
# resolved through the same binding read an event run uses, and is put
# through the same close epilogue. That epilogue's FIRST write is the close
# notice, and that write is the state read: the relay refuses it pre-storage
# on an archived room, so a room already closed costs one refused send and no
# discovery snapshot is consulted (the CLI projects `archived` away from the
# membership listing anyway, and the snapshot can lag the archive). The settle
# window keeps the sweep off a PR whose own close run may still be queued or
# running; if the two do meet, the later one's notice is refused and it exits
# clean. The sweep never creates a room and never posts a fallback notice (it
# has no durable record that one went out, so it would repeat every half
# hour).
#
# THAT REFUSAL PROVES THE ROOM IS ARCHIVED, NOT THAT ITS CLOSE RAN. A room
# archived by hand while its PR was open refuses the notice exactly the same
# way, and treating that as "nothing left to do" would leave every
# cross-channel reference to the PR on its old open/reopened banner for good.
# So a close that COMPLETES records itself in a per-PR addressable note
# (bind_pr's CLOSE_MARKER_SLUG), readable whatever state the room is in, and
# a reopen invalidates it. Archived plus marker means finished; archived
# without it means finish the half that does not need this room — the
# annotations — and record that.
#
# THE SWEEP'S PRE-WRITE PR RE-READ IS NOT A FENCE. Sweep and event runs sit
# in different concurrency groups, so a reopen can land between that read and
# the archive and complete first, leaving the room archived under an open PR
# with no later sweep to notice (the listing enumerates closed PRs only).
# There is no compare-and-set spanning GitHub and the relay, so the two
# converge instead: the sweep re-reads after its writes and, on a PR that is
# open again, puts the room through the same reopen epilogue the event run
# uses. That is the only case in which the sweep unarchives — an archived
# room under an open PR is otherwise the owner's own business, and `reopened`
# is announced normally.
#
# AND THAT COMPENSATION IS NOT A FENCE EITHER. Its own read is a snapshot in
# exactly the same way, so a second close can complete while the sweep is
# restoring the room and land BEFORE the reopen banners the sweep then writes
# last — leaving the room archived and the marker `closed` while every
# cross-channel reference says reopened, which no later sweep revisits. So
# the convergence is a LOOP, not one pass: the sweep tracks the lifecycle
# state it last made durable and keeps applying the opposite epilogue until a
# read taken AFTER its own last write agrees with it. Re-applying a close
# that way is forced past the archived-plus-marker silent path — the marker
# may have been written by the very run that raced us, and this run's stale
# banners still have to be reversed. A lifecycle still flipping after
# CONVERGE_MAX_PASSES is red: the sweep says so and leaves the PR to the next
# one, rather than reporting a repair it cannot show.
#
# CHANNEL NAMES CARRY THE PROJECT PREFIX: `buzz-pr-N`, never bare `pr-N`.
# Every repo that mirrors into openvelvet prefixes with its own project name
# (velvet uses `velvet-pr-N`), because the community is shared and PR numbers
# are not. Unprefixed, velvet PR #57 and buzz PR #57 resolve to one channel —
# adoption would hand this workflow velvet's room and it would post buzz
# diffs into it. Do not "tidy" the prefix away.
#
# Unlike velvet, this workflow has NO legacy-name fallback to a bare `pr-N`,
# and must not grow one: it has never created one, so such a fallback would
# reach into velvet's channels rather than recover its own.
#
# ACCEPTED IS NOT APPLIED. The relay stores a channel-mutating event and only
# then runs its side effect, logging and swallowing any failure ("Side effect
# failed" in handlers/ingest.rs). `buzz channels …` exits 0 on storage, so a
# clean exit proves the event exists, never that `archived_at`, the TTL, or a
# membership row changed. NO SUCCESS PATH BELOW REPORTS AN UNVERIFIED
# MUTATION. Each one is fenced by an authoritative postcondition — a kind-39002
# roster read, or the relay's own pre-storage refusal of writes to an archived
# channel — and where no postcondition exists the mutation is not performed at
# all rather than performed and assumed:
#   * no channel TTL is ever set on a success path. A channel's TTL is
#     unobservable through the CLI (`channels get` projects only id/name/
#     description/created_at; `channels search` exposes `archived` but not
#     `ttl`), so a TTL write can never be confirmed. The velvet-era
#     "archive 404s on the hosted relay, fall back to a 60s idle TTL" branch is
#     therefore gone: it turned an unverifiable write into a green close job,
#     which is exactly the defect. Archive works on this relay (verified live
#     2026-08-09: `channels archive` applied, and the follow-up write came back
#     `invalid: channel is archived`), and if a host ever loses it again the
#     answer is a red job, not a fallback that cannot be checked.
#   * the archive fence probes with `channels update --no-ttl`, which is a
#     genuine no-op on these rooms — they never carry a TTL — chosen precisely
#     so the probe observes without mutating.
#
# THE PR→CHANNEL BINDING IS DURABLE AND CI-OWNED. Each PR's channel UUID is
# recorded in a CI-authored NIP-23 note whose slug is derived from the repo and
# PR number, and read back at an exact addressable coordinate (kind, author,
# d-tag): exact, uncapped, and writable by no one else.
#
# Creating the room and writing that note are two separate durable writes, so
# a run cancelled between them (cancel-in-progress makes that a live risk)
# leaves a room with no note. THE BINDING IS THEREFORE A FAST PATH, NEVER THE
# PROOF OF ABSENCE. When it is missing, absence is established by listing the
# channels THIS CI IDENTITY IS A MEMBER OF and finding no room of ours named
# `buzz-pr-N`. CI owns every room it creates, so that list contains the room if
# it exists at all; it is bounded by one room per mirrored PR rather than by
# every channel in a community shared with velvet; it includes archived rooms
# (verified live); and a full window is treated as INDETERMINATE and fails the
# job instead of reading as absence. `channels search` is deliberately not used
# anywhere: it fetches a capped newest-first window of kind-39000 records for
# the whole community and filters names client-side, so its empty result
# carries no information at all.
#
# Channel names are not unique — anyone authenticated can pre-create an open
# `buzz-pr-N`. A squatted room simply never appears as ours: the scan only sees
# rooms CI belongs to, and any candidate CI does not OWN is skipped rather than
# adopted, so a squatter can neither capture the seed card nor wedge the job.
#
# Requires two repo secrets (provision with scripts/buzz-mint-auth-tag.py):
#   BUZZ_CI_PRIVATE_KEY — a DEDICATED Nostr key for CI (never the owner key).
#   BUZZ_CI_AUTH_TAG    — NIP-OA auth tag for that key, signed by the community
#     owner. Satisfies the relay's ViaOwner membership gate.
# NIP-OA delegation carries no community clause, so velvet's existing CI
# identity works here unchanged — copying those two secret values across is
# enough, and minting a second identity is optional.
#
# THE CI IDENTITY ALSO NEEDS A kind:0 PROFILE CARRYING THAT SAME AUTH TAG.
# The relay's membership gate reads the tag from each event, but an agent
# harness deciding whether a non-owner author may fire a turn under
# respond_to: owner-only reads it from the author's PROFILE (buzz-acp's
# check_sibling_via_profile, fail closed). Without the profile, every card
# and mention this workflow posts is stored and delivered — and silently
# dropped by every owner-only agent it names. The sync step self-heals this
# by publishing the profile whenever the relay has none; see
# ensure_ci_profile below.
#
# THE CI IDENTITY IS PART OF EVERY CHANNEL'S STATE, so BUZZ_CI_PRIVATE_KEY is
# not freely rotatable. Channels are owned by the key that created them, the
# binding notes are addressed under that key, and the seed marker is only
# trusted from it — a new key owns none of that and cannot archive, unarchive,
# or re-TTL an existing room.
#
# That is enforced, not merely documented: EXPECTED_CI_PUBKEY below pins the
# identity, and the job aborts before touching the relay if the key in the
# secret derives to anything else. The pin is load-bearing because EVERY view
# this workflow has of the world is scoped to the current key — the binding
# note is read at its author coordinate, and the membership scan lists only
# rooms it belongs to. A rotated key therefore sees an empty world, and
# without the pin it would read that as "no room exists" and mint a second
# `buzz-pr-N` under the new identity while the real history stayed under the
# retired one. Absence is only meaningful for the identity that owns the
# rooms, so the identity is checked first.
#
# Rotating for real means, in one reviewed change: transfer ownership of every
# live room to the new pubkey, re-point each binding note to it, and update
# EXPECTED_CI_PUBKEY in the same PR. The pin being a constant rather than a
# repo variable is deliberate — it makes rotation a reviewed code change and
# costs an urgent key revocation a PR to restore mirroring, which is the right
# trade for a mirror. It is a PUBLIC key: it already appears as the owner of
# every room this workflow created and as the author of every seed card.
#
# Optional repo variable:
#   BUZZ_FALLBACK_CHANNEL — channel UUID for close notices on PRs that predate
#     this workflow (they have no #buzz-pr-N channel). Unset is fine and is the
#     expected state: no PR was open when this landed, so every PR the workflow
#     will ever see gets a channel at `opened`. When unset, the close path logs
#     and exits cleanly instead of failing.
#
# The buzz CLI comes from Sprig — Block's static-musl multicall binary
# (rolling release `sprig-latest`, rebuilt on every push to block/buzz main —
# a hard checksum pin broke within hours). The tarball is verified against
# the release's own .sha256 manifest: transport integrity, with the
# block/buzz GitHub release as the trust root.
#
# Note this repo IS buzz, so building the CLI from the PR's own source is
# possible — and is deliberately NOT done. The mirror must keep working for
# exactly the PRs most worth discussing: the ones that do not compile.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # Closes GitHub never announced — see the header. Off the other sweeps'
  # cadence (auto-merge 4-59/10, review watchdog 9-59/10).
  schedule:
    - cron: "1,31 * * * *"
  workflow_dispatch:
    inputs:
      sweep_days:
        description: "Reconcile PRs closed within this many days (the cron uses 7)"
        type: string
        default: "7"

# Event runs serialize per PR, and a newer push cancels an older run (the
# synchronize arm's quiet window relies on that). The sweep has its own group
# and is never cancelled: there is nothing newer to make way for, and a
# cancelled sweep would leave a room with its close notice posted and its
# archive not yet proven.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('buzz-mirror-{0}', github.event.number) || 'buzz-mirror-sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The sweep lists closed PRs and re-reads each one at the write.
  pull-requests: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # A sweep with a backlog runs one full close epilogue per stale room.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 30 }}
    # PRs from forks of this fork run without secrets, so every buzz command
    # would fail auth. Skip rather than fail: an unauthenticated run has
    # nothing useful to do and a red X on a contributor's PR is misleading.
    # The sweep runs only on this repository, for the same reason.
    if: >-
      (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && github.repository == 'yjc801/buzz')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install buzz CLI (sprig multicall)
        run: |
          URL=https://github.com/block/buzz/releases/download/sprig-latest/sprig-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o sprig.tar.gz "$URL"
          curl -fsSL -o sprig.sha256 "$URL.sha256"
          sed 's|  .*|  sprig.tar.gz|' sprig.sha256 | sha256sum -c -
          echo "sprig sha256 (provenance): $(cut -c1-64 sprig.sha256)"
          mkdir -p "$HOME/.sprig" && tar -xzf sprig.tar.gz -C "$HOME/.sprig"
          ln -s "$HOME/.sprig/sprig" "$HOME/.sprig/buzz"
          echo "$HOME/.sprig" >> "$GITHUB_PATH"

      - name: Sync PR channel
        env:
          BUZZ_RELAY_URL: https://openvelvet.communities.buzz.xyz
          BUZZ_PRIVATE_KEY: ${{ secrets.BUZZ_CI_PRIVATE_KEY }}
          BUZZ_AUTH_TAG: ${{ secrets.BUZZ_CI_AUTH_TAG }}
          # Read by the sweep alone: an event run never touches GitHub.
          GH_TOKEN: ${{ github.token }}
          # The sweep's window, and how long a close must have settled before
          # the sweep will touch it — see sweep_missed_closes. The cron gets
          # the default; the dispatch input widens the window for a one-off
          # backfill. An event run reads neither.
          SWEEP_DAYS: ${{ github.event.inputs.sweep_days || '7' }}
          SWEEP_SETTLE_SECS: "1800"
          # Ceiling on how many closed PRs the sweep pages through looking for
          # the window's start — a completeness check, not a page size: reaching
          # it before passing the window fails the sweep instead of examining
          # part of the window.
          SWEEP_LIST_LIMIT: "1000"
          # Page size of that listing — the REST maximum. Exposed only so the
          # contract test can exercise the paging with tiny pages.
          SWEEP_PAGE_SIZE: "100"
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.number }}
          # The payload head, not `git rev-parse HEAD`: it is the review
          # request's identity (the reviewer pins its verdict to it and the
          # review watchdog matches requests to heads by it), so it must be
          # the head this event announced even if the branch moved again
          # during checkout.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The head this push replaced (empty except on synchronize) — named
          # on the update card so the reviewer knows which in-flight review
          # is now stale.
          PREV_HEAD_SHA: ${{ github.event.before }}
          # When the push landed, per GitHub. The synchronize event bumps the
          # PR's updated_at, so this is the push, not the workflow. It is the
          # cutoff for "has the reviewer already acknowledged this head" —
          # see PUSHED_AT below for why it cannot be read from the clock at
          # the point the question is asked.
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          # Quiet window before a push is announced to the reviewer. Pushes
          # arrive in bursts; each reviewer mention steers (cancels and
          # re-prompts) a review already running, so announcing every push
          # would restart the review several times per burst. A newer push
          # cancels this run (concurrency above), so only the LAST push in a
          # burst survives the sleep and reaches the mention. Repo variable
          # BUZZ_REVIEW_QUIET_SECS overrides; keep it under 5 minutes or
          # raise timeout-minutes to match.
          REVIEW_QUIET_SECS: ${{ vars.BUZZ_REVIEW_QUIET_SECS || 180 }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          # Pre-workflow PRs have no #buzz-pr-N channel; close notices for them
          # go here. Empty is supported — see the header.
          FALLBACK_CHANNEL: ${{ vars.BUZZ_FALLBACK_CHANNEL }}
          # Alex — the reviewer agent (mention by pubkey so notification doesn't
          # depend on display-name resolution)
          REVIEWER_NAME: Alex
          REVIEWER_PUBKEY: 276883e88d5a20e0cbd760ac2c12876f69e32585861da2258344863e5833b3dd
          # Will — the buzz platform coding agent; member of every task room.
          # NOT Chris (velvet's coder): his instructions scope him to velvet's
          # apps/api + packages/* and tell him to stop rather than work outside
          # them, so pointing him at a Rust workspace either gets a refusal or
          # gets work his own prompt disowns.
          CODER_NAME: Will
          CODER_PUBKEY: 15e158a9408649cc82dbe8637d25a63f9cde38cfb1b4ca35f59a8075080b470b
          # Community owner — added to every new channel so it shows up in
          # their sidebar (open channels are joinable but not auto-joined).
          OWNER_PUBKEY: 632318a2b1a944927ca4167a5f4e66d0b5d00bae33323ee31d3b935b4b82d420
          # The pinned CI identity — the public half of BUZZ_CI_PRIVATE_KEY, and
          # the owner of every room this workflow has created. See the header:
          # changing it without migrating channel ownership and the binding
          # notes forks the room history, so the job refuses to run on any
          # other key rather than discovering an empty world and rebuilding it.
          EXPECTED_CI_PUBKEY: fbc33a2cf3637867fa90e9e3e334304701e1fdf3c57eae4283cea60134f604af
        run: |
          RANGE="origin/${BASE_REF}...HEAD"

          # WHEN THE PUSH LANDED — the cutoff for "has the reviewer already
          # acknowledged this head", captured here and never later.
          #
          # A coder's in-channel handoff reaches an AWAKE reviewer, so he can
          # start on this head and say so within seconds of the push. But the
          # question is not asked until after checkout, CLI installation,
          # channel resolution and provisioning, and the scope routing's
          # full-history walks — minutes, on a busy room. A cutoff stamped at
          # that point cannot see an acknowledgement that arrived during it,
          # so the mirror would p-tag the reviewer and steer (cancel and
          # re-prompt) the very review it was trying not to disturb. Reading
          # the clock at the point of the question answers a different
          # question than the one being asked.
          #
          # A cutoff is still needed rather than searching all history: a
          # force-push BACK to a previously reviewed head would otherwise
          # match that head's old acknowledgement and suppress the mention
          # for good. Clamped to now so a skewed payload clock cannot push
          # the cutoff into the future, and given the same 5 s allowance the
          # review watchdog uses for author-stamped message clocks.
          #
          # python3 rather than `date -d`: BSD date has no -d, and this
          # parse is covered by .github/scripts/pr-review-wake.test.sh, which
          # developers run on macOS.
          STEP_START=$(date +%s)
          PUSHED_AT=$(python3 -c 'import calendar,sys,time; print(calendar.timegm(time.strptime(sys.argv[1], "%Y-%m-%dT%H:%M:%SZ")))' \
            "$PR_UPDATED_AT" 2>/dev/null || echo "")
          if [ -z "$PUSHED_AT" ] || [ "$PUSHED_AT" -gt "$STEP_START" ]; then
            PUSHED_AT="$STEP_START"
          fi
          PUSHED_AT=$((PUSHED_AT - 5))
          # Scratch file for the stderr of commands whose FAILURE MODE has to be
          # read, not just detected (see read_binding and archive_channel).
          ERRFILE=$(mktemp)

          # CI's own pubkey — authenticates the seed marker (only a
          # CI-authored card proves provisioning; the channel is open, so
          # anyone authenticated can post the predictable prefix), proves
          # channel ownership on adoption, and picks edit-vs-react in the
          # annotation sweep. Derived from the runtime secret so nothing is
          # hardcoded.
          CI_PUB=$(NOSTR_SECRET="$BUZZ_PRIVATE_KEY" python3 scripts/buzz-mint-auth-tag.py pubkey)
          printf '%s' "$CI_PUB" | grep -qE '^[0-9a-f]{64}$' || {
            echo "CI pubkey derivation failed — failing so the rerun re-probes" >&2
            exit 1
          }

          # Identity fence, and it has to come FIRST — before the binding read,
          # before any scan, before anything is created. Every question this
          # workflow asks the relay is scoped to the key it is holding: the
          # binding note is read at that key's author coordinate, and the
          # membership scan lists only rooms that key belongs to. So a
          # different key does not see a conflict, it sees an EMPTY WORLD, and
          # every downstream "provably absent" becomes true-but-meaningless —
          # the workflow would cheerfully mint a second #buzz-pr-N under the
          # new identity and go green while the real room stayed under the old
          # one. Absence is only meaningful for the identity that owns the
          # rooms, so the identity is established before absence is consulted.
          if [ "$CI_PUB" != "$EXPECTED_CI_PUBKEY" ]; then
            echo "BUZZ_CI_PRIVATE_KEY derives to ${CI_PUB}," >&2
            echo "but this workflow is pinned to ${EXPECTED_CI_PUBKEY}." >&2
            echo "Refusing to run: the pinned identity owns every existing #buzz-pr-N room and" >&2
            echo "authors every binding note, and this key can see neither. Continuing would" >&2
            echo "fork the room history rather than rotate it." >&2
            echo "To rotate: transfer ownership of every live room to the new pubkey, re-point" >&2
            echo "each binding note, and update EXPECTED_CI_PUBKEY in the same PR." >&2
            exit 1
          fi

          # THE PINNED IDENTITY'S PROFILE, NOT JUST ITS KEY, IS LOAD-BEARING.
          # Two consumers read the NIP-OA auth tag through two different
          # doors: the relay's membership gate reads it from every EVENT (the
          # CLI injects BUZZ_AUTH_TAG into everything it signs), but an agent
          # harness deciding whether a non-owner author may fire a turn under
          # respond_to: owner-only reads it from the author's kind:0 PROFILE
          # (buzz-acp's check_sibling_via_profile), and fails closed. With no
          # profile, every mention below is stored and delivered — and
          # silently dropped, at debug level, by every owner-only agent it
          # names. Found live 2026-08-31: buzz-pr-101's seed card fired a
          # wake and prompted nobody, and the gap had sat invisible for the
          # mirror's whole history because the previous reviewer ran
          # respond_to: anyone and never consulted the check.
          #
          # Publishing is conditional on ABSENCE: kind:0 is replaceable, so
          # an unconditional republish would stomp out-of-band profile edits.
          # An empty read is the only state that publishes; a failed read
          # fails the job rather than publishing on a guess. The read-back
          # checks existence only — `users get` projects tags away — but that
          # is still a sufficient postcondition for the TAG, because
          # sign_event refuses to emit an event whose auth-tag count doesn't
          # match the BUZZ_AUTH_TAG it was handed: a set-profile that
          # succeeded under this env cannot have stored an untagged profile.
          # Healing is forward-looking only: a harness that has already
          # cached "not a sibling" for this key keeps dropping until that
          # agent process restarts (the sibling-verdict cache has no TTL).
          ensure_ci_profile() {
            local PROFILES N
            PROFILES=$(buzz users get --pubkey "$CI_PUB") || {
              echo "CI profile lookup failed — failing so the rerun re-probes" >&2
              return 1
            }
            N=$(printf '%s' "$PROFILES" | jq 'length') || return 1
            if [ "$N" -gt 0 ]; then
              return 0
            fi
            echo "CI identity has no kind:0 profile — publishing one so owner-only agents accept its mentions"
            buzz users set-profile --name "Buzz CI" || {
              echo "CI profile publish failed — failing so the rerun retries" >&2
              return 1
            }
            PROFILES=$(buzz users get --pubkey "$CI_PUB") || {
              echo "CI profile read-back failed — failing so the rerun re-probes" >&2
              return 1
            }
            N=$(printf '%s' "$PROFILES" | jq 'length') || return 1
            if [ "$N" -eq 0 ]; then
              echo "CI profile publish was accepted but is not readable back — failing so the rerun retries" >&2
              return 1
            fi
          }
          ensure_ci_profile || exit 1

          bind_pr() {
            # Everything keyed by PR number, derived in one place: an event
            # run keys itself once, and the sweep re-keys per PR through the
            # same function so the two can never disagree on a name or slug.
            PR_NUMBER="$1"
            NAME="buzz-pr-${PR_NUMBER}"
            # Slug of this PR's binding note. Lowercased and slash-free to stay
            # inside the note-slug charset; asserted rather than assumed, because
            # a slug the CLI rejects would turn every lookup into a hard error.
            BINDING_SLUG=$(printf 'pr-mirror-%s-%s' "$GITHUB_REPOSITORY" "$PR_NUMBER" \
              | tr '[:upper:]' '[:lower:]' | tr '/' '-')
            # This PR's close-completion marker, and why it has to exist:
            # AN ARCHIVED ROOM IS NOT PROOF THAT ITS CLOSE RAN. A room can be
            # archived by hand while its PR is open, and the close epilogue's
            # first write is refused on ANY archived room, so the refusal
            # alone cannot tell a finished close from one that never
            # happened. Taking the silent path on the second strands every
            # cross-channel reference on its old open/reopened banner for
            # good. This note is written only when a close epilogue
            # COMPLETES, is invalidated by a reopen, and stays readable
            # whatever state the room is in — it is an addressable note at
            # CI's own author coordinate, not a channel-scoped write.
            CLOSE_MARKER_SLUG="${BINDING_SLUG}-closed"
            local SLUG
            for SLUG in "$BINDING_SLUG" "$CLOSE_MARKER_SLUG"; do
              printf '%s' "$SLUG" | grep -qE '^[a-z0-9._-]{1,80}$' || {
                echo "note slug '$SLUG' is outside the note-slug charset" >&2
                return 1
              }
            done
            # The annotation sweep's search key — repo-qualified, so velvet's
            # PR #N and this repo's PR #N never annotate each other.
            PR_PATH="github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
          }

          # Ceiling on the membership scan that proves a room's absence. It has
          # to exceed the number of channels this CI identity belongs to —
          # roughly one per PR mirrored by every repo sharing the identity — or
          # the scan reports "unproven" and fails the job rather than guessing.
          MEMBER_SCAN_LIMIT=2000

          # FAILURE IS SIGNALLED BY STATUS AND CHECKED AT EVERY CALL SITE.
          # No helper below may report a broken relay by returning an empty
          # string: empty means "absent" to its caller, and absent means
          # "create a second channel". They return non-zero instead, and every
          # call site tests it explicitly rather than leaning on `bash -e`.
          # That is not stylistic — `exit` inside `$(…)` only ends that
          # subshell, and a helper called from inside another command
          # substitution (resolve_channel calls read_binding, and is itself
          # called as `CH=$(resolve_channel)`) does NOT reliably abort the
          # step: on bash 3.2 the enclosing function demonstrably carries on
          # with an empty value. An explicit `|| exit 1` behaves the same on
          # every shell.

          read_binding() {
            # Prints the bound channel UUID, or nothing when the binding is
            # PROVABLY absent. Unlike a name search this is an exact
            # addressable read (kind 30023, author = CI, d = slug): not
            # scanned, not capped, and writable by no one else. The CLI's exit
            # 1 *with* a not_found category is the only outcome that means "no
            # such note"; every other failure — including a bare exit 1 from a
            # usage error — reports failure to the caller, because absence
            # inferred from a broken read mints a duplicate channel.
            local OUT STATUS=0
            OUT=$(buzz notes get --name "$BINDING_SLUG" --author me --content-only 2>"$ERRFILE") \
              || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              printf '%s' "$OUT" | tr -d '[:space:]'
              return 0
            fi
            if [ "$STATUS" -eq 1 ] && grep -q '"error":"not_found"' "$ERRFILE"; then
              return 0
            fi
            echo "binding lookup failed (exit $STATUS): $(cat "$ERRFILE")" >&2
            return 1
          }

          write_binding() {
            # Output is redirected because callers run this inside a command
            # substitution that is capturing a channel UUID.
            printf '%s\n' "$1" | buzz notes set --name "$BINDING_SLUG" \
              --title "PR mirror binding: ${GITHUB_REPOSITORY}#${PR_NUMBER}" \
              --tag pr-mirror --content - >/dev/null
          }

          # The only marker content that means "this PR's close epilogue
          # completed". A reopen overwrites it with something else rather
          # than deleting it, so "present but not this" and "absent" are one
          # case to every reader.
          CLOSE_MARKER_DONE=closed

          read_close_marker() {
            # Prints the marker's content, or nothing when it is PROVABLY
            # absent. Same exact-coordinate read, and the same refusal to
            # infer absence from a broken read, as read_binding: absence is
            # what sends the close epilogue down its do-the-work path, and a
            # relay blip must not become a second annotation sweep under
            # every reference.
            local OUT STATUS=0
            OUT=$(buzz notes get --name "$CLOSE_MARKER_SLUG" --author me --content-only 2>"$ERRFILE") \
              || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              printf '%s' "$OUT" | tr -d '[:space:]'
              return 0
            fi
            if [ "$STATUS" -eq 1 ] && grep -q '"error":"not_found"' "$ERRFILE"; then
              return 0
            fi
            echo "close-marker lookup failed (exit $STATUS): $(cat "$ERRFILE")" >&2
            return 1
          }

          write_close_marker() {
            # $1 is the state token — CLOSE_MARKER_DONE, or anything else to
            # invalidate. Output is redirected because callers may run inside
            # a command substitution capturing something else.
            printf '%s\n' "$1" | buzz notes set --name "$CLOSE_MARKER_SLUG" \
              --title "PR mirror close marker: ${GITHUB_REPOSITORY}#${PR_NUMBER}" \
              --tag pr-mirror --content - >/dev/null
          }

          channel_roster() {
            # kind-39002 group members, read at an exact `#d` coordinate rather
            # than through the capped name scan. The relay rebuilds this
            # snapshot from its members table AFTER the membership write
            # commits, so a pubkey's PRESENCE here proves that write applied.
            # Its ABSENCE proves nothing — the emission itself is best-effort
            # and can leave the snapshot stale — so callers must fail rather
            # than conclude "not a member".
            buzz channels members --channel "$1"
          }

          ci_owns() {
            # 0 = CI holds the channel's owner role, 1 = it does not,
            # 2 = the roster could not be read (never "not owned").
            # `channels create` makes the creator the owner, so CI owns exactly
            # the rooms it created — that is what separates our room from a
            # squatter's room of the same name.
            local ROSTER
            ROSTER=$(channel_roster "$1") || return 2
            printf '%s' "$ROSTER" | jq -e --arg ci "$CI_PUB" \
              'any(.[]?; .pubkey == $ci and .role == "owner")' >/dev/null || return 1
            return 0
          }

          assert_ci_owner() {
            # Post-create sanity check: we just made this room, so anything but
            # "owned" means the create did not apply the way we were told.
            local CH="$1"
            ci_owns "$CH"
            case "$?" in
              0) return 0 ;;
              1) echo "channel $CH (#${NAME}) is not owned by this CI identity." >&2
                 echo "Either the create did not apply, or BUZZ_CI_PRIVATE_KEY was rotated" >&2
                 echo "without migrating channel ownership; see this workflow's header." >&2
                 return 1 ;;
              *) echo "roster read failed for $CH — failing so the rerun re-probes" >&2
                 return 1 ;;
            esac
          }

          verify_members() {
            # The postcondition for add-member. Accepted-and-unapplied is
            # invisible in the CLI's exit code, so re-read the roster and
            # require every REQUIRED pubkey to be present; anything else fails
            # the job so the next action retries the add instead of sealing a
            # half-provisioned room with a seed card.
            local CH="$1" ROSTER P
            ROSTER=$(channel_roster "$CH") || {
              echo "roster read failed for $CH — failing so the rerun re-probes" >&2
              return 1
            }
            for P in "$OWNER_PUBKEY" "$REVIEWER_PUBKEY" "$CODER_PUBKEY"; do
              printf '%s' "$ROSTER" | jq -e --arg p "$P" 'any(.[]?; .pubkey == $p)' >/dev/null || {
                echo "add-member for $P was accepted but is not applied — failing so the rerun retries" >&2
                return 1
              }
            done
          }

          resolve_by_membership() {
            # Establish, without guessing, whether a room of ours already
            # exists. Prints its UUID, or nothing when there provably is none;
            # returns non-zero when the answer is unknowable.
            #
            # Scoped to the channels this CI identity is a MEMBER of: CI owns
            # every room it creates, so the room is in that set if it exists,
            # the set includes archived rooms (verified live), and it grows by
            # roughly one room per mirrored PR — a bound this workflow controls,
            # unlike the whole shared community.
            local LIST N COUNT I CH
            LIST=$(buzz channels list --member --limit "$MEMBER_SCAN_LIMIT") || {
              echo "membership listing failed — failing so the rerun re-probes" >&2
              return 1
            }
            N=$(printf '%s' "$LIST" | jq 'length') || return 1
            if [ "$N" -ge "$MEMBER_SCAN_LIMIT" ]; then
              # A full window is indistinguishable from a truncated one, so
              # absence stays UNPROVEN and must not be acted on.
              echo "membership listing filled its window ($N of $MEMBER_SCAN_LIMIT) — absence unproven." >&2
              echo "Raise MEMBER_SCAN_LIMIT; creating a room on this evidence could duplicate one." >&2
              return 1
            fi
            COUNT=$(printf '%s' "$LIST" | jq --arg n "$NAME" '[.[] | select(.name == $n)] | length') || return 1
            I=0
            while [ "$I" -lt "$COUNT" ]; do
              CH=$(printf '%s' "$LIST" | jq -r --arg n "$NAME" --argjson i "$I" \
                '[.[] | select(.name == $n)][$i].channel_id') || return 1
              ci_owns "$CH"
              case "$?" in
                0) write_binding "$CH" || return 1
                   printf '%s' "$CH"
                   return 0 ;;
                1) # Someone else's room that happens to share the name and has
                   # CI in it. Skipping rather than failing means a squatter
                   # cannot wedge this workflow; we simply use our own room.
                   echo "ignoring #${NAME} room $CH — not owned by this CI identity" >&2 ;;
                *) echo "roster read failed for $CH — failing so the rerun re-probes" >&2
                   return 1 ;;
              esac
              I=$((I + 1))
            done
            # Stdout is the resolved UUID, so this goes to stderr.
            echo "no #${NAME} room among this identity's ${N} channels — none exists" >&2
          }

          resolve_channel() {
            # The binding note is the fast path, not the proof of absence: the
            # room and its note are two separate writes, so a run cancelled
            # between them leaves a room with no note. Only the membership scan
            # can tell "never created" from "created, note lost".
            local BOUND
            BOUND=$(read_binding) || return 1
            if [ -z "$BOUND" ]; then
              resolve_by_membership
              return $?
            fi
            printf '%s' "$BOUND" \
              | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || {
              echo "binding note holds '${BOUND}', not a channel UUID — refusing to guess" >&2
              return 1
            }
            printf '%s' "$BOUND"
          }

          create_channel() {
            buzz channels create --name "$NAME" --type stream --visibility open \
              --description "GitHub PR #${PR_NUMBER} (${GITHUB_REPOSITORY}): ${PR_TITLE}" \
              | jq -r .channel_id
          }

          # Name the author of the head, and the coding agent who owns the
          # changed paths — mentioned on a coder's own PR only.
          #
          # WHO AUTHORED THE HEAD. Every PR here is opened under the owner's
          # GitHub login (the coding agents push with the owner's credentials),
          # so PR_AUTHOR never identifies the author. The branch does: the
          # coder prompts pin their work to agent/<slug> — owner-managed, like
          # the scope glob below — so agent/* is a coder's own PR and every
          # other branch is the owner's own work, however the commits were
          # produced. Naming that on the card is what velvet#205 was missing:
          # the card there told the path owner to stand by on the owner's own
          # PR and the reviewer handed him the findings, so the rounds ran
          # between the reviewer and a coder on a change neither of them owned
          # and the owner, who wrote it, was tagged only at the round cap. On
          # this repository every PR to date is owner-authored, so until Will
          # opens one the line always reads "the owner".
          #
          # THE Author LINE IS DISPLAY-ONLY, AND THAT IS A CONTRACT ON THE
          # CONSUMER, NOT A PROPERTY OF THIS LINE. Normative statement and
          # rollout status: docs/pr-review-routing.md. This workflow runs on
          # `pull_request`, so it runs from the PR's OWN head: a PR that edits
          # this file chooses the text its own review request carries, signed
          # with CI's key — the same injection path the trust-boundary note in
          # seed_card() closes for the rest of the card, and the reason the
          # auto-merge trailer is specified in the reviewer's system prompt
          # instead of here. Being factual and directive-free is necessary and
          # NOT sufficient: a line that merely states a false fact steers a
          # consumer that routes on facts just as well as an order does. Only
          # the consumer can close this, by deriving the branch class from its
          # own authenticated read of the head ref and treating this line as a
          # cross-check at most. Keeping the line honest is this file's whole
          # share of that: no "findings go to", no "route by hand".
          #
          # AS DEPLOYED, THAT CONSUMER RULE IS NOT YET IN PLACE — the reviewer
          # prompt's upstream (velvet's tracked
          # .agents/skills/review-code/SKILL.md, "Deliver the review and hand
          # off") still routes on this line. Do not read the paragraph above as
          # a guarantee the system currently provides; see the rollout status in
          # docs/pr-review-routing.md for what is and is not true today.
          #
          # WHY CI NAMES THE CODER AND NOT THE REVIEWER. Alex reads the diff
          # and judges ownership better than a path glob can — but a mention
          # from Alex can never WAKE anyone. buzz-waker refuses to start an
          # agent on an agent-authored event ("No agent-authored event ever
          # wakes anything", crates/buzz-waker/src/decide.rs), because two
          # agents p-tagging each other would keep the pair alive with no human
          # in the loop. That rule is deliberate and load-bearing; this does not
          # work around it, it sits on the other side of it. CI's key is not a
          # registered agent, so a CI mention DOES wake — the same reason
          # `@Alex please review` reaches a cold Alex today.
          #
          # Both mentions are pointless on a PR the coder did not write, so a
          # coder is mentioned, and woken, only on his own PR. Waking him for a
          # heads-up on the owner's change buys a sprite start and a coder
          # standing by for findings that will never be his. The path owner is
          # still named on the owner's card, in plain text (an `@Name` resolves
          # against channel members and would tag him), so the owner can hand
          # the PR over with one mention.
          #
          # ON HIS OWN PR THE MENTION FOLLOWS AUTHORSHIP, NOT THE PATH GLOB.
          # An `agent/` head says a coder wrote every line in it, so the
          # findings are his on every path it touches — including paths his
          # prompt does not claim, where the answer is "out of my scope, say so
          # and stop" and he still has to be the one to say it. The reviewer's
          # ownership table hands it to him on any path too, and CI's mention
          # is the only one that can wake him, so gating the mention on the
          # glob would leave a docs-only or web-only `agent/` PR assigned to
          # someone CI never notified. The glob's remaining job is the
          # informational path-owner note on an OWNER-authored card, where
          # nobody is being assigned anything.
          #
          # CAVEAT, and it is the whole reason this is only half a fix here:
          # Will currently runs on a LOCAL backend, and decide.rs excludes local
          # agents outright ("Local agents are never candidates: whoever owns
          # their process already has a start path"). So this mention does not
          # wake him either until he moves to a provider backend. It is correct
          # and forward-compatible, not sufficient.
          #
          # The globs mirror the scope Will's own prompt declares. They must keep
          # mirroring it: a mention outside that scope buys "say so in-thread and
          # stop", not work. `web/` is deliberately absent — his prompt does not
          # claim it — so a web-only PR routes to nobody and the card says so.
          AUTHOR_LINE=""
          SCOPE_NAMES=""
          SCOPE_MENTIONS=()
          route_scope() {
            local FILES OWNERS=""
            # Reset, not append: only one seeding path runs per job today, but a
            # second call must not mention the same agent twice. It is also the
            # ONLY thing that clears the mention on a non-`agent/` head — that
            # arm sets no scope at all, deliberately, rather than setting one
            # and unsetting it.
            AUTHOR_LINE=""
            SCOPE_NAMES=""
            SCOPE_MENTIONS=()
            FILES=$(git diff --name-only "$RANGE")
            if printf '%s\n' "$FILES" \
              | grep -qE '^(crates/|desktop/|mobile/|migrations/|scripts/|\.github/workflows/)'; then
              OWNERS="${OWNERS}${CODER_NAME} "
            fi
            case "$HEAD_REF" in
              agent/*)
                SCOPE_NAMES="@${CODER_NAME} "
                SCOPE_MENTIONS=(--mention "$CODER_PUBKEY")
                AUTHOR_LINE="Author: a coding agent — \`${HEAD_REF}\` is an \`agent/\` branch."
                ;;
              *)
                if [ -n "$OWNERS" ]; then
                  AUTHOR_LINE="Author: the owner — \`${HEAD_REF}\` is not an \`agent/\` branch. Path owner(s): ${OWNERS% } — named for reference, not assigned."
                else
                  AUTHOR_LINE="Author: the owner — \`${HEAD_REF}\` is not an \`agent/\` branch. No coding agent owns the changed paths."
                fi
                ;;
            esac
            # Explicit: `grep -q` returning 1 is the ordinary "no match" answer,
            # and the default `bash -e` shell would treat a trailing non-zero as
            # a job failure.
            return 0
          }

          diff_files() {
            git diff --name-status "$RANGE" | head -25
            COUNT=$(git diff --name-only "$RANGE" | wc -l)
            if [ "$COUNT" -gt 25 ]; then
              printf '…and %s more files\n' "$((COUNT - 25))"
            fi
          }

          seed_card() {
            printf '**PR #%s — %s**\n' "$PR_NUMBER" "$PR_TITLE"
            printf '`%s` → `%s` by %s\n' "$HEAD_REF" "$BASE_REF" "$PR_AUTHOR"
            # The full head SHA is the review request's identity: the reviewer
            # pins its verdict to it and the review watchdog matches requests
            # to heads by this exact line. Keep the wording stable.
            printf 'Review head: `%s`\n' "$HEAD_SHA"
            # Factual and directive-free; display-only by contract on the
            # reviewer, not by anything enforceable here — see the Author-line
            # note above route_scope and docs/pr-review-routing.md.
            printf '%s\n' "$AUTHOR_LINE"
            printf '%s\n\n%s\n\n' "$PR_URL" "$(git diff --shortstat "$RANGE")"
            printf '```\n%s\n```\n' "$(diff_files)"
            if [ -n "$PR_BODY" ]; then
              if [ "${#PR_BODY}" -gt 1500 ]; then
                EXCERPT=$(printf '%s' "$PR_BODY" | head -c 1500 | sed '$d')
                if [ -z "$EXCERPT" ]; then
                  EXCERPT=$(printf '%s' "$PR_BODY" | head -c 1500)
                fi
                printf '\n---\n%s\n\n_…description truncated — full text on GitHub._\n' "$EXCERPT"
              else
                printf '\n---\n%s\n' "$PR_BODY"
              fi
            fi
            # NOTHING HERE MAY CONFIGURE THE REVIEWER. This card is built from
            # repo- and PR-controlled material (title, branch, body, diff), and
            # the reviewer treats everything it reviews as data. The machine
            # trailer that authorizes an auto-merge is therefore specified in
            # the reviewer's owner-managed system prompt — canonical copy in
            # docs/pr-auto-merge.md — and never instructed from here. An
            # earlier revision of this line asked for the trailer directly;
            # that is exactly the injection path a compliant reviewer must
            # ignore, and it would have let repo content steer a merge
            # authorization if one did not. The `Author:` line above is inside
            # that same boundary: it reports a fact and directs nothing, and
            # the reviewer is required to confirm the branch class against
            # GitHub rather than take this card's word for who gets the
            # findings — docs/pr-review-routing.md, which also records that the
            # deployed reviewer does not do so yet.
            printf '\n@%s please review.\n' "$REVIEWER_NAME"
            if [ -n "$SCOPE_NAMES" ]; then
              printf '\n%s— your pull request. Stand by for @%s'"'"'s review before starting work; this is a heads-up, not an assignment.\n' \
                "$SCOPE_NAMES" "$REVIEWER_NAME"
            fi
          }

          provision_members() {
            # Roleless add-member is the role-preserving upsert: the relay
            # keeps an existing member's role and defaults only a genuinely
            # NEW member to "member" (verified against the live relay). Every
            # add is REQUIRED, and every add is then CONFIRMED against the
            # roster, because the relay stores the membership event before
            # applying it and swallows an application failure. The seed marker
            # is posted only after all three are confirmed, so a partial leaves
            # the channel unseeded and a later action retries provisioning
            # instead of sealing the gap. The partial is left in place, never
            # deleted — a soft-delete can strand a searchable-but-unwritable
            # discovery ghost.
            local CH="$1" P
            for P in "$OWNER_PUBKEY" "$REVIEWER_PUBKEY" "$CODER_PUBKEY"; do
              if ! buzz channels add-member --channel "$CH" --pubkey "$P"; then
                echo "add-member failed for $P — job fails; the rerun resumes this partial channel" >&2
                return 1
              fi
            done
            verify_members "$CH"
          }

          channel_seed_state() {
            # Prints "seeded" or "unseeded"; returns non-zero when the
            # lookup itself fails, so callers retry instead of mistaking a
            # transport error for a missing marker. Only a CI-AUTHORED
            # marker counts: the channel is open, so any authenticated user
            # could post the predictable prefix into a partial and seal it
            # against recovery. The seed card is posted
            # LAST in provisioning and is therefore the OLDEST message, so
            # a bounded newest-page probe would eventually false-negative
            # on any long-lived channel; this walks the full history
            # backward with --before (an inclusive cursor). Message history
            # is the relay's primary event store, unlike the kind-39002
            # discovery snapshots, so the marker itself is trustworthy.
            # Only an EMPTY page ends the walk — a count-based stop would
            # misread a silent relay page cap as end-of-history — and a
            # stalled full page (every message in one second) steps the
            # cursor back one second rather than terminating.
            local CH="$1" BEFORE="" PAGE OLDEST MATCH COUNT
            while :; do
              if [ -z "$BEFORE" ]; then
                PAGE=$(buzz messages get --channel "$CH" --limit 100) || return 1
              else
                PAGE=$(buzz messages get --channel "$CH" --limit 100 --before "$BEFORE") || return 1
              fi
              COUNT=$(printf '%s' "$PAGE" | jq '[(.messages? // .)[]?] | length') || return 1
              if [ "$COUNT" -eq 0 ]; then
                echo unseeded; return 0   # walked past the start of history
              fi
              MATCH=0
              printf '%s' "$PAGE" | jq -e --arg p "**PR #${PR_NUMBER} —" --arg ci "$CI_PUB" \
                '[(.messages? // .)[]? | select(.pubkey == $ci and (.content | startswith($p)))] | length > 0' \
                >/dev/null || MATCH=$?
              case "$MATCH" in
                0) echo seeded; return 0 ;;
                1) ;;             # valid page without the marker — keep paging
                *) return 1 ;;    # page unparseable — lookup failure, not absence
              esac
              OLDEST=$(printf '%s' "$PAGE" \
                | jq -r '[(.messages? // .)[]?.created_at] | min') || return 1
              if [ -n "$BEFORE" ] && [ "$OLDEST" -ge "$BEFORE" ]; then
                # Full page of one timestamp: step past it. A marker hidden
                # beyond the page size inside a single second is unreachable,
                # which would take >100 channel events in that second.
                BEFORE=$((OLDEST - 1))
              else
                BEFORE="$OLDEST"
              fi
            done
          }

          reviewer_replied_to_head() {
            # Prints yes/no: has the reviewer posted a message in channel $1
            # since unix time $2 that names head $3? A coder's in-channel
            # @mention reaches an AWAKE reviewer (it only cannot wake a
            # sleeping one), so by the end of the quiet window he may already
            # be reviewing this very head — a second p-tag would then steer
            # (cancel and re-prompt) that review. A reply that does not name
            # the head is treated as unrelated (most likely the verdict on
            # the previous head landing during the window) and the mention
            # still goes out. A failed read is an error, never "no": a relay
            # blip must not become a p-tag that restarts a running review.
            local PAGE COUNT
            PAGE=$(buzz messages get --channel "$1" --since "$2" --limit 100) || return 1
            COUNT=$(printf '%s' "$PAGE" | jq --arg r "$REVIEWER_PUBKEY" --arg h "$3" \
              '[(.messages? // .)[]? | select(.pubkey == $r) | select(.content | contains($h[0:7]))] | length') || return 1
            if [ "$COUNT" -gt 0 ]; then echo yes; else echo no; fi
          }

          coder_already_mentioned() {
            # Prints "yes" or "no": whether THIS CI identity has ever put a
            # p-tag on the coder in this channel before now — on the seed
            # card if the PR opened inside his scope, or on a prior
            # synchronize notice from this fix's own mention below. Answers
            # "has he already been woken for this PR", not "is he in scope
            # right now" — those diverge exactly when scope was added on a
            # later push, which is the case this exists to catch.
            #
            # Same full-history walk as channel_seed_state and for the same
            # reason: the mention is most likely on the seed card, which is
            # the OLDEST message once the channel has been live a while, so
            # a bounded newest-page probe would eventually false-negative.
            # Only an empty page ends the walk; a stalled full page (every
            # message landing in one second) steps the cursor back one
            # second rather than terminating.
            local CH="$1" BEFORE="" PAGE OLDEST MATCH COUNT
            while :; do
              if [ -z "$BEFORE" ]; then
                PAGE=$(buzz messages get --channel "$CH" --limit 100) || return 1
              else
                PAGE=$(buzz messages get --channel "$CH" --limit 100 --before "$BEFORE") || return 1
              fi
              COUNT=$(printf '%s' "$PAGE" | jq '[(.messages? // .)[]?] | length') || return 1
              if [ "$COUNT" -eq 0 ]; then
                echo no; return 0   # walked past the start of history
              fi
              MATCH=0
              printf '%s' "$PAGE" | jq -e --arg ci "$CI_PUB" --arg p "$CODER_PUBKEY" \
                '[(.messages? // .)[]? | select(.pubkey == $ci) |
                  select((.tags // [])[]? | select(.[0] == "p" and .[1] == $p))] | length > 0' \
                >/dev/null || MATCH=$?
              case "$MATCH" in
                0) echo yes; return 0 ;;
                1) ;;             # valid page without a matching p-tag — keep paging
                *) return 1 ;;    # page unparseable — lookup failure, not absence
              esac
              OLDEST=$(printf '%s' "$PAGE" \
                | jq -r '[(.messages? // .)[]?.created_at] | min') || return 1
              if [ -n "$BEFORE" ] && [ "$OLDEST" -ge "$BEFORE" ]; then
                BEFORE=$((OLDEST - 1))
              else
                BEFORE="$OLDEST"
              fi
            done
          }

          ensure_provisioned() {
            # Runs on EVERY action that finds an existing channel, not just
            # opened reruns: with cancel-in-progress, a successor
            # synchronize/reopened/closed run can be the first to arrive
            # after a create-then-cancel partial, and skipping recovery
            # there would launder an owner-less channel into green forever.
            local CH="$1" STATE
            if ! STATE=$(channel_seed_state "$CH"); then
              echo "seed-marker lookup failed — failing so the rerun re-probes instead of guessing" >&2
              return 1
            fi
            if [ "$STATE" = seeded ]; then
              echo "channel $NAME fully provisioned"
              return 0
            fi
            echo "channel $NAME exists but is unseeded — resuming provisioning"
            route_scope
            provision_members "$CH" || return 1
            seed_card | buzz messages send --channel "$CH" --content - \
              --mention "$REVIEWER_PUBKEY" "${SCOPE_MENTIONS[@]}"
          }

          create_and_seed() {
            local CH
            route_scope
            CH=$(create_channel)
            printf '%s' "$CH" \
              | grep -qE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' || {
              echo "channel create returned no UUID (got: '${CH}') — failing so the rerun re-probes" >&2
              return 1
            }
            # Prove the room exists and is ours BEFORE recording it: a binding
            # written from an unverified create would point later runs at a
            # room that may not be there, and they would fail on it forever.
            # Widening the create→bind window costs nothing now, because a lost
            # binding is recovered by the membership scan — which finds any
            # room CI owns — rather than by the note's absence.
            assert_ci_owner "$CH" || return 1
            write_binding "$CH" || return 1
            provision_members "$CH" || return 1
            seed_card | buzz messages send --channel "$CH" --content - \
              --mention "$REVIEWER_PUBKEY" "${SCOPE_MENTIONS[@]}"
          }

          archive_channel() {
            # `buzz channels archive` exits 0 once the relay STORES the
            # kind-9002 event; the archive itself runs afterwards as a side
            # effect whose failure is logged and swallowed, so a clean exit
            # does not mean `archived_at` was set. The fence is the relay's own
            # PRE-storage gate: an archived channel rejects every
            # channel-scoped write except unarchive, and that rejection is
            # decided before any side effect runs, so unlike the archive
            # command it cannot false-succeed. The probe is `--no-ttl`: these
            # rooms never carry a TTL, so on a live channel it changes nothing,
            # and the only thing read from it is whether the relay refused.
            local CH="$1" ATTEMPT ARCHIVE_ERR PROBE_ERR
            for ATTEMPT in 1 2 3; do
              if ! buzz channels archive --channel "$CH" >/dev/null 2>"$ERRFILE"; then
                # No TTL fallback here any more. Archive works on this relay,
                # and the fallback's only effect was to report success from a
                # write whose application nothing can observe — see the header.
                # A red job is the honest outcome, and rerunning retries.
                ARCHIVE_ERR=$(cat "$ERRFILE")
                echo "archive rejected: $ARCHIVE_ERR" >&2
                return 1
              fi
              PROBE_ERR=""
              buzz channels update --channel "$CH" --no-ttl >/dev/null 2>"$ERRFILE" \
                || PROBE_ERR=$(cat "$ERRFILE")
              case "$PROBE_ERR" in
                *"channel is archived"*)
                  echo "channel archived — proved by the relay refusing a write to it"
                  return 0 ;;
                "")
                  echo "attempt ${ATTEMPT}: archive accepted but not applied — retrying" ;;
                *)
                  echo "archive fence probe failed: $PROBE_ERR" >&2
                  return 1 ;;
              esac
            done
            # Out of attempts: the room is still live and we cannot prove
            # otherwise. Set a short idle TTL so the relay's reaper closes it
            # anyway — but this is a mitigation on a path that ALREADY fails,
            # never evidence, precisely because a swallowed TTL is invisible.
            buzz channels update --channel "$CH" --ttl 60 >/dev/null 2>&1 \
              || echo "idle-TTL mitigation also rejected" >&2
            echo "archive never took effect after 3 attempts — room may still be live" >&2
            return 1
          }

          # Every visible chat message that references this PR, annotated with
          # the PR's current state. Nostr edits are author-signed: the bot can
          # truly edit only its own messages; anyone else's get a status
          # reaction plus a threaded reply. Coverage is bounded by the channels
          # the CI identity is a member of and by the 100 hits `messages
          # search` returns (its --limit is capped at 100 inside the CLI).
          # The search key is PR_PATH, set by bind_pr.
          # Any banner this workflow has ever written, so re-annotating
          # replaces the previous state instead of stacking on top of it.
          BANNER_RE='^(✅|🚫|♻️) '

          annotate_references() {
            # $1    banner line ("" strips any existing banner and adds none)
            # $2    emoji to react with on other authors' messages ("" for none)
            # $3... emoji to un-react first (may be empty)
            local BANNER="$1" ADD_EMOJI="$2" HITS
            shift 2
            local DROP_EMOJI=("$@")
            # A failed search fails the job rather than reading as "nothing to
            # annotate": a silent skip leaves every cross-channel reference
            # stuck on the previous state with nothing to correct it.
            HITS=$(buzz messages search --query "$PR_PATH" --limit 100) || {
              echo "reference search failed — failing so the rerun re-annotates" >&2
              return 1
            }
            printf '%s' "$HITS" \
              | jq -c '(.messages? // .)[]?' \
              | while read -r HIT; do
                  MID=$(printf '%s' "$HIT" | jq -r '.id // empty')
                  [ -z "$MID" ] && continue
                  printf '%s' "$HIT" | jq -e --arg p "$PR_PATH" \
                    '.content | contains($p)' >/dev/null || continue
                  MAUTHOR=$(printf '%s' "$HIT" | jq -r '.pubkey // empty')
                  MCH=$(printf '%s' "$HIT" | jq -r \
                    '[.tags[]? | select(.[0]=="h" or .[0]=="channel") | .[1]][0] // empty')
                  if [ "$MAUTHOR" = "$CI_PUB" ]; then
                    BODY=$(printf '%s' "$HIT" | jq -r '.content' \
                      | grep -vE "$BANNER_RE" | sed '/./,$!d' || true)
                    if [ -n "$BANNER" ]; then
                      NEW=$(printf '%s\n\n%s' "$BANNER" "$BODY")
                    else
                      NEW="$BODY"
                    fi
                    buzz messages edit --event "$MID" --content "$NEW" || true
                  else
                    for E in "${DROP_EMOJI[@]}"; do
                      buzz reactions remove --event "$MID" --emoji "$E" || true
                    done
                    if [ -n "$ADD_EMOJI" ]; then
                      buzz reactions add --event "$MID" --emoji "$ADD_EMOJI" || true
                    fi
                    if [ -n "$MCH" ] && [ -n "$BANNER" ]; then
                      printf '%s — PR #%s\n%s\n' "$BANNER" "$PR_NUMBER" "$PR_URL" \
                        | buzz messages send --channel "$MCH" --content - --reply-to "$MID" || true
                    fi
                  fi
                done
          }

          set_close_status() {
            if [ "$PR_MERGED" = "true" ]; then
              STATUS="✅ **Merged**"; EMOJI="✅"
            else
              STATUS="🚫 **Closed without merge**"; EMOJI="🚫"
            fi
          }

          close_epilogue() {
            # The whole close for a PR whose room is known — $1 is its UUID.
            # Shared by the `closed` event and by sweep_missed_closes, so a
            # close GitHub never announced gets exactly the treatment an
            # announced one does. Sets CLOSE_OUTCOME: "reconciled" when this
            # call closed the room, "annotated" when the room was already
            # archived with no close on record and only the cross-channel
            # half was left to do, "archived" when this PR's close is already
            # complete and there was nothing to do at all.
            #
            # $2 is "force" when the caller has already written the OTHER
            # lifecycle state to this PR's references in this same run and
            # needs them reversed — see converge_lifecycle. It suppresses the
            # silent path only; every other behaviour is identical.
            #
            # THE FIRST WRITE IS THE FENCE. The relay refuses every
            # channel-scoped write on an archived room BEFORE storing it —
            # the gate archive_channel proves its own work with — so the
            # close notice going out proves the room is live, and its refusal
            # proves the room is already archived (a rerun of a finished
            # close, or the sweep and the event run meeting on one PR), in
            # which case nothing is left to do and nothing has been written.
            # No snapshot is consulted: the discovery record can lag the
            # archive (the reaper commits archived_at before its emission),
            # and a stale "live" would cost a reaction and a threaded reply
            # under every cross-channel reference a second time. Every other
            # write follows the fence for that reason.
            local CH="$1" FORCE="${2:-}" SEND_ERR MARKER
            CLOSE_OUTCOME=""
            if ! printf '%s — archiving this channel.\n%s\n' "$STATUS" "$PR_URL" \
                | buzz messages send --channel "$CH" --content - 2>"$ERRFILE"; then
              SEND_ERR=$(cat "$ERRFILE")
              case "$SEND_ERR" in
                *"channel is archived"*)
                  # ARCHIVED IS NOT CLOSE-COMPLETE. The refusal proves the
                  # room is archived and nothing more; the marker is what
                  # proves this PR's close epilogue ran. Present, this is a
                  # rerun of a finished close (or the sweep and the event run
                  # meeting on one PR) and must be green and silent. Absent,
                  # the room was archived without a close — by hand while the
                  # PR was open, or by a close that died between the archive
                  # and the marker — and its cross-channel references are
                  # still on their old banner with nothing else coming to
                  # correct them. Those live in OTHER rooms, so they can be
                  # finished even though this room can no longer be written
                  # to; the room's own notice is the one thing that is
                  # genuinely lost, and the archive it announces has
                  # already happened.
                  # FORCE bypasses the silent path: a marker written by the
                  # run that raced this one says ITS close is on record, and
                  # says nothing about the reopen banners this run put up and
                  # now has to reverse.
                  MARKER=$(read_close_marker) || return 1
                  if [ "$MARKER" = "$CLOSE_MARKER_DONE" ] && [ "$FORCE" != force ]; then
                    echo "#${NAME} is archived and this close is on record — nothing left to do"
                    CLOSE_OUTCOME=archived
                    return 0
                  fi
                  if [ "$FORCE" = force ]; then
                    echo "#${NAME} is archived — reversing this run's own reopen banners outside the room"
                  else
                    echo "#${NAME} is archived with no close on record — finishing the close outside the room"
                  fi
                  annotate_references "$STATUS" "$EMOJI" "♻️" || return 1
                  write_close_marker "$CLOSE_MARKER_DONE" || return 1
                  CLOSE_OUTCOME=annotated
                  return 0 ;;
              esac
              echo "close notice rejected: $SEND_ERR" >&2
              return 1
            fi
            # Even the close path recovers a partial first, so an owner-less
            # channel is never archived into invisibility. After the fence,
            # so the seed card it may post lands in a room proven live — and
            # before the annotation sweep, so that card gets its banner too.
            ensure_provisioned "$CH" || return 1
            annotate_references "$STATUS" "$EMOJI" "♻️" || return 1
            archive_channel "$CH" || return 1
            # LAST, and only on the path that finished: the marker means
            # "this PR's close epilogue completed", so every failure above
            # must leave it absent and be redone by the rerun or the sweep.
            write_close_marker "$CLOSE_MARKER_DONE" || return 1
            CLOSE_OUTCOME=reconciled
          }

          reopen_epilogue() {
            # The whole reopen for a PR whose room is known — $1 is its UUID.
            # Shared by the `reopened` event and by the sweep's post-write
            # convergence loop, which reaches it when a reopen landed while
            # the sweep was closing the same PR.
            local CH="$1"
            # Invalidated FIRST: while this marker still reads "closed" a
            # later close would take the silent path on an archived room and
            # skip the annotations this reopen is about to reverse.
            write_close_marker reopened || return 1
            # Restoration is driven by write outcomes, not the discovery
            # snapshot (the reaper commits archived_at before its discovery
            # emission, so snapshots can be stale). Unarchive is
            # best-effort — rejected harmlessly when the channel is already
            # active. The reopen notice is the fence, and it is sent FIRST:
            # the relay refuses every channel-scoped write on an archived
            # room BEFORE storing it, so this send succeeding proves the
            # room is live no matter what any snapshot said, and it fails
            # loudly here rather than as a confusing add-member error
            # further down. It replaces the old `--no-ttl` clear, which
            # proved the same thing but also performed a mutation whose
            # application nothing could verify — and there is now no TTL to
            # clear, because no success path ever sets one.
            buzz channels unarchive --channel "$CH" \
              || echo "unarchive rejected (channel likely already active) — proceeding"
            printf 'PR #%s reopened on GitHub — channel unarchived.\n%s\n' \
              "$PR_NUMBER" "$PR_URL" | buzz messages send --channel "$CH" --content - || return 1
            # Recovery runs after the fence: a create-then-cancel partial
            # can reach reopened without ever having been provisioned.
            ensure_provisioned "$CH" || return 1
            # Reverse the close sweep everywhere, not just in this room. The
            # close path edited CI-authored references, reacted on everyone
            # else's, and replied under them; a room notice supersedes none
            # of that, so without this a reopened PR stays marked "Closed
            # without merge" across Buzz — including on its own seed card.
            # Runs after the unarchive fence so writes into this channel are
            # accepted.
            annotate_references "♻️ **Reopened**" "♻️" "✅" "🚫" || return 1
          }

          hydrate_pr() {
            # Re-key this run to one PR from its GitHub record ($1, the
            # pulls/N JSON), giving the sweep the facts a `pull_request`
            # payload gives an event run. The head is fetched for RANGE,
            # which only the recovery leg (a seed card for an unprovisioned
            # room) reads; a head or base that can no longer be fetched —
            # the base branch of a stacked PR is gone by the time the sweep
            # sees it — leaves that card's diff empty, and says so, rather
            # than failing the archive.
            local JSON="$1" BASE_SHA
            PR_TITLE=$(printf '%s' "$JSON" | jq -r '.title // empty') || return 1
            PR_URL=$(printf '%s' "$JSON" | jq -r '.html_url // empty') || return 1
            PR_BODY=$(printf '%s' "$JSON" | jq -r '.body // empty') || return 1
            PR_AUTHOR=$(printf '%s' "$JSON" | jq -r '.user.login // empty') || return 1
            PR_MERGED=$(printf '%s' "$JSON" | jq -r '.merged // false') || return 1
            HEAD_REF=$(printf '%s' "$JSON" | jq -r '.head.ref // empty') || return 1
            HEAD_SHA=$(printf '%s' "$JSON" | jq -r '.head.sha // empty') || return 1
            BASE_REF=$(printf '%s' "$JSON" | jq -r '.base.ref // empty') || return 1
            BASE_SHA=$(printf '%s' "$JSON" | jq -r '.base.sha // empty') || return 1
            if [ -z "$PR_URL" ] || [ -z "$HEAD_SHA" ]; then
              echo "#${PR_NUMBER}: PR record lacks a URL or a head — refusing to guess" >&2
              return 1
            fi
            RANGE="${BASE_SHA}...${HEAD_SHA}"
            git fetch -q origin "refs/pull/${PR_NUMBER}/head" "$BASE_SHA" 2>/dev/null \
              || echo "#${PR_NUMBER}: head or base no longer fetchable — a recovery seed card would carry no diff" >&2
            return 0
          }

          # A lifecycle that flips more often than this inside one sweep pass
          # is not something to keep chasing: the sweep says so and goes red.
          CONVERGE_MAX_PASSES=4

          converge_lifecycle() {
            # $1 PR number, $2 its room. LIFECYCLE_WRITTEN holds the state
            # this run last made durable ("closed" or "open" — GitHub's own
            # vocabulary). Re-read the PR AFTER those writes and, while
            # GitHub disagrees, apply the opposite epilogue and read again.
            #
            # THE SWEEP AND AN EVENT RUN ARE NOT SERIALIZED WITH EACH OTHER:
            # they sit in different concurrency groups (one group for the
            # sweep, one per PR for events), so the sweep's `state == closed`
            # check is a snapshot and nothing more. A reopen arriving after
            # it — its `reopened` run unarchiving the room, reversing the
            # banners and finishing — is then followed by this sweep posting
            # a close notice and archiving the room under a PR that is open.
            # Nothing else would ever correct that: the sweep's own listing
            # only enumerates CLOSED PRs, so the room stays archived and the
            # references stay marked closed for as long as the PR lives.
            #
            # A pre-write re-read cannot close that window — there is no
            # relay-side compare-and-set spanning GitHub's state and the
            # room's — so the writes CONVERGE instead: whichever of the two
            # runs writes last also checks last and restores what the other
            # left wrong. ONE compensating pass is not enough, because ITS
            # read is a snapshot in exactly the same way: a second close can
            # complete while this run is restoring the room, putting its
            # archive and its marker BEFORE the reopen banners written here,
            # and the durable state ends up split — archived and `closed`,
            # references reopened, and every later sweep taking the silent
            # path over it. The loop is what removes that: it returns only
            # when a read taken after this run's last write agrees with that
            # write, so no write of this run's is left standing as the stale
            # one. The doubled work along the way is idempotent — the
            # unarchive is best-effort, the banners are replaced rather than
            # stacked, and the marker is rewritten with the same token.
            #
            # A re-read that FAILS is red: the room has been written and this
            # run cannot show that GitHub agrees, which is precisely the
            # state that must not be reported as a completed repair. So is a
            # lifecycle still flipping after CONVERGE_MAX_PASSES.
            local NUM="$1" CH="$2" POST STATE PASSES=0
            while :; do
              PASSES=$((PASSES + 1))
              POST=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUM}") || {
                echo "#${NUM}: post-close re-read failed — cannot show the room's state matches GitHub's" >&2
                return 1
              }
              STATE=$(printf '%s' "$POST" | jq -r '.state // empty') || return 1
              case "$STATE" in
                open|closed) ;;
                *) echo "#${NUM}: post-close re-read carries no state — refusing to guess" >&2
                   return 1 ;;
              esac
              [ "$STATE" = "$LIFECYCLE_WRITTEN" ] && return 0
              if [ "$PASSES" -ge "$CONVERGE_MAX_PASSES" ]; then
                echo "#${NUM}: lifecycle still changing after ${PASSES} passes — #${NAME} is left to the next sweep rather than reported as repaired" >&2
                return 1
              fi
              hydrate_pr "$POST" || return 1
              if [ "$STATE" = open ]; then
                echo "#${NUM}: reopened while this sweep was closing it — restoring #${NAME}" >&2
                reopen_epilogue "$CH" || return 1
                LIFECYCLE_WRITTEN=open
                RESTORED=$((RESTORED + 1))
              else
                echo "#${NUM}: closed again while this sweep was restoring it — re-closing #${NAME}" >&2
                set_close_status
                # Forced: the marker may already read "closed" because the
                # run that raced this one wrote it, while this run's reopen
                # banners are still up in every other room.
                close_epilogue "$CH" force || return 1
                LIFECYCLE_WRITTEN=closed
                RECLOSED=$((RECLOSED + 1))
              fi
            done
          }

          list_closed_page() { # list_closed_page <page> → one REST page of closed PRs
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=${SWEEP_PAGE_SIZE}&page=${1}" || {
              echo "closed-PR listing failed on page ${1} — failing so the next sweep retries" >&2
              return 1
            }
          }

          # The offsets a walk of that listing was taken at, as the sequence of
          # PR numbers on a page: two reads of one page agree on this exactly
          # when nothing entered or left the listing ahead of it.
          page_offsets() { printf '%s' "$1" | jq -c '[.[] | .number]'; }

          sweep_missed_closes() {
            # Reconcile closes GitHub never announced — see the header. Every
            # same-repo PR closed at least SWEEP_SETTLE_SECS ago and within
            # SWEEP_DAYS is resolved through the binding read an event run
            # uses and, if it has a room, put through close_epilogue, whose
            # first write tells a live room from an archived one. Closes
            # inside the settle window are left to their own event run —
            # queued, or running under timeout-minutes above. The PR is
            # re-read at the moment of the write: a reopen since the listing
            # hands the room back to the `reopened` run instead of archiving
            # it under an open PR.
            #
            # One PR's failure fails the sweep but not its siblings: each is
            # independent, the cron retries, and a red run is the honest
            # outcome for a room this identity could not resolve or close.
            local NOW OLDEST NEWEST CANDIDATES NUM CLOSED_AT PR_JSON
            local PAGES PAGE FETCHED CHUNK N PAGE_OLDEST
            local ATTEMPT MOVED PREV_OFFSETS RECHECK PREFIX RE_PAGE WALKED
            local SWEEP_LIST_ATTEMPTS=3
            local EXAMINED=0 RECONCILED=0 ANNOTATED=0 ARCHIVED=0 NOROOM=0 RESTORED=0 RECLOSED=0 FAILED=0
            local LIFECYCLE_WRITTEN=""
            printf '%s' "$SWEEP_DAYS" | grep -qE '^[0-9]{1,3}$' || {
              echo "SWEEP_DAYS must be a small integer, got '${SWEEP_DAYS}'" >&2
              return 1
            }
            printf '%s' "$SWEEP_LIST_LIMIT" | grep -qE '^[0-9]{1,4}$' || {
              echo "SWEEP_LIST_LIMIT must be a small integer, got '${SWEEP_LIST_LIMIT}'" >&2
              return 1
            }
            printf '%s' "$SWEEP_PAGE_SIZE" | grep -qE '^[0-9]{1,3}$' || {
              echo "SWEEP_PAGE_SIZE must be a small integer, got '${SWEEP_PAGE_SIZE}'" >&2
              return 1
            }
            # Base 10, explicitly: bash arithmetic reads a leading zero as
            # octal, so a hand-typed `sweep_days=008` would pass the digit
            # check above and then abort the whole sweep at the window
            # calculation with "value too great for base".
            SWEEP_DAYS=$((10#$SWEEP_DAYS))
            SWEEP_LIST_LIMIT=$((10#$SWEEP_LIST_LIMIT))
            SWEEP_PAGE_SIZE=$((10#$SWEEP_PAGE_SIZE))
            [ "$SWEEP_DAYS" -gt 0 ] || {
              echo "SWEEP_DAYS must be at least 1, got '${SWEEP_DAYS}'" >&2
              return 1
            }
            if [ "$SWEEP_PAGE_SIZE" -lt 1 ] || [ "$SWEEP_PAGE_SIZE" -gt 100 ]; then
              echo "SWEEP_PAGE_SIZE must be 1..100, got '${SWEEP_PAGE_SIZE}'" >&2
              return 1
            fi
            NOW=$(date +%s)
            NEWEST=$((NOW - SWEEP_SETTLE_SECS))
            OLDEST=$((NOW - SWEEP_DAYS * 86400))
            # THE LISTING IS THE REST PULLS INDEX, WALKED PAST THE WINDOW'S
            # START — not the search index, and not a prefix of anything. Two
            # ways to lose exactly the PRs this sweep exists for were paid for
            # here:
            #   * a bare newest-first page filtered afterwards silently drops
            #     any in-window close sitting behind a page's worth of other
            #     PRs — and because only closed PRs are ever listed, a
            #     candidate hidden that way is hidden from every later sweep
            #     too, ageing out unreconciled while every run reports green;
            #   * the search index (`gh pr list --search`, the `closed:`
            #     qualifier) OMITS PRs GitHub closed itself on the deletion of
            #     their base branch. Verified 2026-09-04: buzz#128 and
            #     velvet#210 are absent from `closed:>=` results and present
            #     in the REST list. Those are the base-deleted stacked PRs
            #     whose close never got a run — the sweep's whole reason to
            #     exist — so a search-bounded sweep examined every close in
            #     the window except the ones it was for.
            # So this pages `pulls?state=closed` sorted by updated_at
            # descending until a full page reaches past the window's start.
            # That is complete: a close bumps updated_at, so every PR closed
            # within the window has updated_at >= its closed_at >= OLDEST and
            # sits before that point; a short page is the end of the listing.
            # The cap is a completeness check, not a page size: reaching it
            # before the boundary means the window was NOT enumerated, and
            # reporting green on an incomplete repair is exactly the silence
            # this sweep exists to end — the remedy is a narrower dispatch
            # window. Fork heads never got a room (the job condition skips
            # them) and are not candidates; nor is a head whose repository
            # is gone.
            # AND EACH PAGE BOUNDARY IS VERIFIED, because a page number is an
            # offset into a list that moves. `sort=updated` orders by a
            # mutable field and GitHub hands out no frozen listing: every page
            # is an independent offset slice of whatever the list holds at the
            # moment it is asked for. Between two of these requests a PR can
            # be updated (it moves toward the front) or reopened (it leaves
            # `state=closed` altogether), and every record after it lands at a
            # different offset. Shifted back, the next page merely repeats
            # records already read — harmless. Shifted forward, the next page
            # begins PAST one record, dropping it from the walk with the
            # oldest-page check below still satisfied and the sweep still
            # green: the same silent miss this whole change is undoing, on the
            # same rooms.
            # So a walk is trusted only if the offsets it was taken at still
            # hold — and that takes two checks, because they fail on different
            # movements. Each page's predecessor is re-read at the boundary,
            # which catches a shift that has already reverted by the end of
            # the walk. But a BALANCED pair of movements — one record leaving
            # the front while a later one moves up to the front — leaves every
            # offset between them untouched, so no boundary sees anything at
            # all while the record that moved up is skipped from a stretch the
            # walk has already passed. So the WHOLE accepted prefix is re-read
            # once the walk ends, page 1 upward, before a single candidate is
            # processed: every page still holding the records the walk read at
            # that offset. A walk whose offsets moved is enumerated again from
            # page 1. One that will not hold still for a whole walk is red,
            # not green — nothing is archived from a walk that may have
            # skipped, and the next sweep tries again. The residual is a shift
            # that reverts before the re-read that would have caught it; that
            # costs one sweep interval, not the window.
            PAGES=$(mktemp)
            PREFIX=$(mktemp)
            ATTEMPT=0
            while :; do
              ATTEMPT=$((ATTEMPT + 1))
              : > "$PAGES"
              : > "$PREFIX"
              PAGE=1
              FETCHED=0
              MOVED=""
              PREV_OFFSETS=""
              while :; do
                CHUNK=$(list_closed_page "$PAGE") || return 1
                if [ "$PAGE" -gt 1 ]; then
                  RECHECK=$(list_closed_page "$((PAGE - 1))") || return 1
                  RECHECK=$(page_offsets "$RECHECK") || return 1
                  if [ "$RECHECK" != "$PREV_OFFSETS" ]; then
                    MOVED="the closed-PR listing shifted under the walk: page $((PAGE - 1)) no longer holds the records page ${PAGE} was read after"
                    break
                  fi
                fi
                N=$(printf '%s' "$CHUNK" | jq 'length') || return 1
                printf '%s\n' "$CHUNK" >> "$PAGES"
                page_offsets "$CHUNK" >> "$PREFIX" || return 1
                FETCHED=$((FETCHED + N))
                if [ "$N" -lt "$SWEEP_PAGE_SIZE" ]; then
                  break   # a short page is the end of the listing
                fi
                PAGE_OLDEST=$(printf '%s' "$CHUNK" \
                  | jq '[.[] | .updated_at | fromdateiso8601] | min') || return 1
                if [ "$PAGE_OLDEST" -lt "$OLDEST" ]; then
                  break   # past the window's start: everything after is older still
                fi
                if [ "$FETCHED" -ge "$SWEEP_LIST_LIMIT" ]; then
                  echo "closed-PR listing reached its ${SWEEP_LIST_LIMIT}-result cap without passing the ${SWEEP_DAYS}-day window's start" >&2
                  echo "— the window was not enumerated completely; re-run with a narrower sweep_days" >&2
                  return 1
                fi
                PREV_OFFSETS=$(page_offsets "$CHUNK") || return 1
                PAGE=$((PAGE + 1))
              done
              if [ -z "$MOVED" ]; then
                RE_PAGE=0
                while IFS= read -r WALKED; do
                  RE_PAGE=$((RE_PAGE + 1))
                  RECHECK=$(list_closed_page "$RE_PAGE") || return 1
                  RECHECK=$(page_offsets "$RECHECK") || return 1
                  [ "$RECHECK" = "$WALKED" ] && continue
                  MOVED="the closed-PR listing shifted under the walk: page ${RE_PAGE} no longer holds the records the walk read there"
                  break
                done < "$PREFIX"
              fi
              [ -n "$MOVED" ] || break
              echo "${MOVED} — enumerating it again" >&2
              if [ "$ATTEMPT" -ge "$SWEEP_LIST_ATTEMPTS" ]; then
                echo "the closed-PR listing moved under all ${SWEEP_LIST_ATTEMPTS} enumerations; the window was not enumerated completely — leaving it to the next sweep" >&2
                return 1
              fi
            done
            CANDIDATES=$(mktemp)
            jq -s -r \
              --arg owner "${GITHUB_REPOSITORY%%/*}" --arg repo "${GITHUB_REPOSITORY#*/}" \
              --argjson oldest "$OLDEST" --argjson newest "$NEWEST" \
              'add // []
               | .[]
               | select(.head.repo != null and .head.repo.owner.login == $owner and .head.repo.name == $repo)
               | select(.closed_at != null)
               | (.closed_at | fromdateiso8601) as $t
               | select($t >= $oldest and $t <= $newest)
               | [.number, .closed_at]
               | @tsv' "$PAGES" > "$CANDIDATES" || return 1
            echo "examining PRs closed within ${SWEEP_DAYS} day(s) and settled for ${SWEEP_SETTLE_SECS}s"
            while IFS=$'\t' read -r NUM CLOSED_AT; do
              [ -n "$NUM" ] || continue
              EXAMINED=$((EXAMINED + 1))
              if ! bind_pr "$NUM"; then
                FAILED=$((FAILED + 1)); continue
              fi
              if ! CH=$(resolve_channel); then
                echo "#${NUM}: room resolution failed" >&2
                FAILED=$((FAILED + 1)); continue
              fi
              if [ -z "$CH" ]; then
                # A PR that predates the mirror, or whose `opened` run never
                # got as far as a room. Nothing to archive.
                NOROOM=$((NOROOM + 1)); continue
              fi
              # Re-read at the side-effect boundary, and take the PR's facts
              # from this read rather than the listing: the close notice and
              # a recovery seed card are built from them.
              if ! PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUM}"); then
                echo "#${NUM}: PR re-read failed" >&2
                FAILED=$((FAILED + 1)); continue
              fi
              if [ "$(printf '%s' "$PR_JSON" | jq -r '.state // empty')" != closed ]; then
                echo "#${NUM}: reopened since the listing — the reopened run owns its room"
                continue
              fi
              if ! hydrate_pr "$PR_JSON"; then
                FAILED=$((FAILED + 1)); continue
              fi
              set_close_status
              if ! close_epilogue "$CH"; then
                echo "#${NUM}: close epilogue failed — #${NAME} may still be live" >&2
                FAILED=$((FAILED + 1)); continue
              fi
              case "$CLOSE_OUTCOME" in
                reconciled)
                  echo "#${NUM}: closed ${CLOSED_AT} with #${NAME} still live — GitHub scheduled no close run; archived it now"
                  RECONCILED=$((RECONCILED + 1)) ;;
                annotated)
                  ANNOTATED=$((ANNOTATED + 1)) ;;
                *) ARCHIVED=$((ARCHIVED + 1)) ;;
              esac
              # THE PRE-WRITE RE-READ IS NOT A FENCE, so the writes are
              # reconciled afterwards — see converge_lifecycle. Only a pass
              # that WROTE something has anything to reconcile.
              case "$CLOSE_OUTCOME" in
                reconciled|annotated)
                  LIFECYCLE_WRITTEN=closed
                  if ! converge_lifecycle "$NUM" "$CH"; then
                    FAILED=$((FAILED + 1))
                  fi ;;
              esac
            done < "$CANDIDATES"
            echo "sweep: ${EXAMINED} examined, ${RECONCILED} reconciled, ${ANNOTATED} annotated outside an archived room, ${ARCHIVED} already archived, ${NOROOM} without a room, ${RESTORED} restored after a concurrent reopen, ${RECLOSED} re-closed after a concurrent close, ${FAILED} failed"
            [ "$FAILED" -eq 0 ]
          }

          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            sweep_missed_closes || exit 1
            exit 0
          fi
          bind_pr "$PR_NUMBER" || exit 1

          case "$PR_ACTION" in
            opened)
              CH=$(resolve_channel) || exit 1
              if [ -n "$CH" ]; then
                ensure_provisioned "$CH" || exit 1
                exit 0
              fi
              create_and_seed || exit 1
              ;;
            synchronize)
              CH=$(resolve_channel) || exit 1
              if [ -z "$CH" ]; then
                create_and_seed || exit 1
              else
                ensure_provisioned "$CH" || exit 1
                # ensure_provisioned only calls route_scope on an unseeded
                # channel (the recovery path) and returns immediately once
                # seeded — the ordinary case for a second push. Recompute here
                # so this update carries the same author-derived mention the
                # seed would: the coder must be p-tagged at least once on his
                # own PR, because CI is the one non-agent author who CAN wake
                # him (crates/buzz-waker/src/decide.rs — no agent-authored
                # event ever wakes anything). This is the recovery leg, not the
                # ordinary one — a channel seeded before the author-derived
                # mention existed, or one whose seed card predates the coder
                # joining — since on an `agent/` head the seed already tagged
                # him and on any other head no coder mention is due at all.
                route_scope
                CODER_UNTAGGED=no
                if [ -n "$SCOPE_NAMES" ]; then
                  ALREADY=$(coder_already_mentioned "$CH") || exit 1
                  [ "$ALREADY" = no ] && CODER_UNTAGGED=yes
                fi
                SYNC_MENTIONS=()
                [ "$CODER_UNTAGGED" = yes ] && SYNC_MENTIONS+=(--mention "$CODER_PUBKEY")
                # Resolution, provisioning and routing ran BEFORE the quiet
                # window so a configuration fault fails fast; only the send
                # waits. A newer push cancels this run during the sleep.
                # PUSHED_AT is the push itself (top of this script), not the
                # clock here — everything above it can take minutes, and an
                # acknowledgement that arrived during it still counts.
                sleep "$REVIEW_QUIET_SECS"
                ACKED=$(reviewer_replied_to_head "$CH" "$PUSHED_AT" "$HEAD_SHA") || exit 1
                if [ "$ACKED" = no ]; then
                  SYNC_MENTIONS+=(--mention "$REVIEWER_PUBKEY")
                fi
                {
                  printf 'Updated to `%s` — %s\n' \
                    "${HEAD_SHA:0:7}" "$(git diff --shortstat "$RANGE")"
                  printf 'Review head: `%s`' "$HEAD_SHA"
                  if [ -n "$PREV_HEAD_SHA" ]; then
                    printf ' (supersedes `%s`)' "${PREV_HEAD_SHA:0:12}"
                  fi
                  printf '\n```\n%s\n```\n' "$(diff_files)"
                  if [ "$CODER_UNTAGGED" = yes ]; then
                    printf '\n%s— your pull request. Stand by for @%s'"'"'s review before starting work; this is a heads-up, not an assignment.\n' \
                      "$SCOPE_NAMES" "$REVIEWER_NAME"
                  fi
                  if [ "$ACKED" = no ]; then
                    printf '\n@%s please review this head. A review in progress on the previous head is stale.\n' "$REVIEWER_NAME"
                  else
                    echo "reviewer already replied to ${HEAD_SHA:0:12} — posting the update without a reviewer mention" >&2
                  fi
                } | buzz messages send --channel "$CH" --content - "${SYNC_MENTIONS[@]}"
              fi
              ;;
            reopened)
              CH=$(resolve_channel) || exit 1
              if [ -z "$CH" ]; then
                # No room to restore, but the close marker still has to be
                # invalidated and the cross-channel references reversed.
                write_close_marker reopened || exit 1
                create_and_seed || exit 1
                annotate_references "♻️ **Reopened**" "♻️" "✅" "🚫" || exit 1
              else
                reopen_epilogue "$CH" || exit 1
              fi
              ;;
            closed)
              set_close_status
              CH=$(resolve_channel) || exit 1
              if [ -z "$CH" ]; then
                # No room to close; the cross-channel references still get
                # their banner.
                annotate_references "$STATUS" "$EMOJI" "♻️" || exit 1
                if [ -z "$FALLBACK_CHANNEL" ]; then
                  echo "no #${NAME} channel and no BUZZ_FALLBACK_CHANNEL set — nothing to archive"
                  exit 0
                fi
                printf '%s — PR #%s: %s\n%s\n' "$STATUS" "$PR_NUMBER" "$PR_TITLE" "$PR_URL" \
                  | buzz messages send --channel "$FALLBACK_CHANNEL" --content -
                exit 0
              fi
              close_epilogue "$CH" || exit 1
              ;;
          esac
