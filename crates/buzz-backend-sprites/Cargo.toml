[package]
name = "buzz-backend-sprites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fly.io Sprites backend provider for Buzz remote agents (docs/remote-agents.md)"

[[bin]]
name = "buzz-backend-sprites"
path = "src/main.rs"

[dependencies]
nostr = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Explicit rustls dep with the ring provider — required to install the
# process-level CryptoProvider at startup. Without it this binary panics on its
# first TLS connection to the Sprites API: the release build compiles every
# sidecar in one cargo invocation (.github/workflows/release.yml), which unifies
# both ring and aws-lc-rs features and leaves rustls unable to auto-select a
# provider. Same dependency and reason as crates/buzz-backend-kubernetes.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
