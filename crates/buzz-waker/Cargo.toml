[package]
name = "buzz-waker"
version.workspace = true
edition.workspace = true
# Overrides the workspace 1.88: the fenced floor store uses
# std::fs::File::lock (stabilised 1.89), which is cross-platform —
# flock on Unix, LockFileEx on Windows. rustix::fs::flock is POSIX-only
# and broke the Windows workspace check.
rust-version = "1.89.0"
license.workspace = true
repository.workspace = true
description = "Headless wake daemon for remote Buzz agents: signed launch bundles and durable anti-rollback state"

[lib]
name = "buzz_waker"
path = "src/lib.rs"

[[bin]]
name = "buzz-waker"
path = "src/main.rs"

[dependencies]
buzz-core  = { workspace = true }
# The provider deploy wire protocol itself (stage, negotiate, invoke) — the
# same implementation the desktop app links, so both callers talk to a
# `buzz-backend-<id>` binary identically. See `effects.rs`.
buzz-provider-deploy = { workspace = true }
nostr       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
hex         = { workspace = true }
uuid        = { workspace = true }
# Zeroes decrypted launch-bundle plaintext after use — it carries the
# agent's nsec, same hygiene `buzz-core::pairing::session` already applies
# to NIP-44 plaintext.
zeroize     = { workspace = true }
# The feed's transport, and the only reason this crate touches a socket. The
# decision core, the cursor and the attempt state machine stay effect-free —
# `feed::FeedTransport` is the seam, and `relay_feed` is its one implementation.
buzz-ws-client = { workspace = true }
# The connection loop (`wake_loop`), the presence tap (`presence_feed`) and
# the daemon binary (`main`) all need a runtime — spawning one wake attempt
# per trigger onto its own task, timing reconnects, and driving graceful
# shutdown. The pure decision core (`decide`, `attempt`'s sequencing itself,
# `cursor`, `floors`, `bundle`) stays runtime-agnostic; only the socket-facing
# layer pulls tokio in as a real dependency rather than a dev one.
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow      = { workspace = true }

[dev-dependencies]
tempfile = "3"
# For relay_feed's mock-relay transport test: a real (local, in-process)
# WebSocket peer to drive `RelayFeed` against, the same server-side halves
# `buzz-ws-client`'s own connection tests already use.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
